<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huatulco: 10 Días de Descanso Genuino</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .slide-fade { animation: slideIn 0.5s ease-in; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="bg-gradient-to-b from-amber-50 to-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function HuatulcoLanding() {
            const [currentProperty, setCurrentProperty] = useState(0);

            const properties = [
                {
                    name: "Solana Huatulco",
                    price: "$1.8K-2.1K MXN",
                    priceCAD: "~$110-130 CAD",
                    capacity: "2 personas",
                    image: "🏖️",
                    description: "Studio moderno en edificio boutique. Ubicación tranquila, céntrica.",
                    amenities: ["WiFi estable", "Piscina", "A 10 min de playas", "Cocina equipada", "Aire acondicionado"],
                    link: "https://www.airbnb.ca/h/solana-huatulco"
                },
                {
                    name: "Loft Amarindo",
                    price: "$70-105 CAD",
                    priceCAD: "$70-105 CAD",
                    capacity: "2 personas",
                    image: "🌴",
                    description: "Loft completamente equipado, muy nueva construcción.",
                    amenities: ["WiFi estable", "Piscina común", "Playa a pie", "Cocina completa", "Lavadora"],
                    link: "https://www.airbnb.ca/h/loftamarindo"
                }
            ];

            const testimonials = [
                { name: "Dominique", text: "Wonderful calm stay. We felt right at home.", origin: "🇨🇦 Canadá" },
                { name: "Shelley", text: "Stayed for 1 month. The apartment functioned well for a long stay.", origin: "🇨🇦 Remote Worker" },
                { name: "Nancy", text: "Beautiful condo with all the amenities. Great location near beaches.", origin: "🇨🇦 Canadá" },
                { name: "Tyler", text: "Perfect for two people. When I'm back in town I will definitely want to stay again.", origin: "🇺🇸 USA" },
                { name: "Judy", text: "Roman always responded quickly. Very helpful & kind.", origin: "🇨🇦 Canadá" }
            ];

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-gradient-to-r from-blue-600 to-teal-600 text-white py-12">
                        <div className="max-w-4xl mx-auto px-4">
                            <h1 className="text-4xl font-bold mb-4">¿Cuándo fue la última vez que te desconectaste de verdad?</h1>
                            <p className="text-xl opacity-90">10 días en Huatulco. Playas, wifi, comodidad. Nada más.</p>
                        </div>
                    </header>

                    {/* Properties Carousel */}
                    <section className="max-w-4xl mx-auto px-4 py-12">
                        <h2 className="text-3xl font-bold mb-8 text-center">Nuestras propiedades</h2>

                        <div className="grid md:grid-cols-2 gap-8 mb-8">
                            {properties.map((prop, idx) => (
                                <div
                                    key={idx}
                                    onClick={() => setCurrentProperty(idx)}
                                    className={`p-8 rounded-lg border-2 cursor-pointer transition ${
                                        currentProperty === idx
                                            ? "border-blue-600 bg-blue-50"
                                            : "border-gray-200 bg-white hover:border-gray-300"
                                    }`}
                                >
                                    <div className="text-5xl mb-4">{prop.image}</div>
                                    <h3 className="text-2xl font-bold mb-2">{prop.name}</h3>
                                    <p className="text-gray-600 mb-4">{prop.description}</p>
                                    <div className="mb-4">
                                        <p className="text-sm font-semibold text-gray-500">PRECIO/NOCHE</p>
                                        <p className="text-2xl font-bold text-blue-600">{prop.priceCAD}</p>
                                    </div>
                                    <ul className="space-y-2 mb-6">
                                        {prop.amenities.slice(0, 3).map((am, i) => (
                                            <li key={i} className="text-sm text-gray-700">✓ {am}</li>
                                        ))}
                                    </ul>
                                    <a
                                        href={prop.link}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="block w-full bg-blue-600 text-white py-3 rounded-lg text-center font-semibold hover:bg-blue-700"
                                    >
                                        Ver en Airbnb →
                                    </a>
                                </div>
                            ))}
                        </div>

                        {/* Detailed view */}
                        <div className="bg-gradient-to-br from-gray-50 to-gray-100 p-8 rounded-lg slide-fade">
                            <h3 className="text-2xl font-bold mb-4">{properties[currentProperty].name}</h3>
                            <div className="grid md:grid-cols-2 gap-8">
                                <div>
                                    <h4 className="font-semibold text-gray-700 mb-3">Amenidades</h4>
                                    <ul className="space-y-2">
                                        {properties[currentProperty].amenities.map((am, i) => (
                                            <li key={i} className="flex items-center text-gray-700">
                                                <span className="text-green-600 mr-3">✓</span> {am}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-semibold text-gray-700 mb-3">Detalles</h4>
                                    <p className="text-gray-700 mb-2"><strong>Capacidad:</strong> {properties[currentProperty].capacity}</p>
                                    <p className="text-gray-700 mb-4"><strong>Mínimo estancia:</strong> 10 días</p>
                                    <p className="text-sm text-gray-600">Ubicación céntrica, a pie de playas Chahue y Santa Cruz. Supermercado a 5 min caminando.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Testimonials */}
                    <section className="bg-white py-12">
                        <div className="max-w-4xl mx-auto px-4">
                            <h2 className="text-3xl font-bold mb-8 text-center">¿Qué dicen otros huéspedes?</h2>
                            <div className="grid md:grid-cols-2 gap-6">
                                {testimonials.map((test, idx) => (
                                    <div key={idx} className="bg-gradient-to-br from-blue-50 to-teal-50 p-6 rounded-lg border border-blue-100">
                                        <p className="text-gray-800 italic mb-4">"{test.text}"</p>
                                        <p className="text-sm font-semibold text-gray-700">{test.name}</p>
                                        <p className="text-xs text-gray-500">{test.origin}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* CTA Section */}
                    <section className="bg-gradient-to-r from-blue-600 to-teal-600 text-white py-12">
                        <div className="max-w-4xl mx-auto px-4 text-center">
                            <h2 className="text-3xl font-bold mb-4">¿Listo para desconectarte?</h2>
                            <p className="text-xl mb-8 opacity-90">Abril disponible. 10 días mínimo. Precio honesto.</p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <a
                                    href={properties[0].link}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="bg-white text-blue-600 px-8 py-4 rounded-lg font-bold hover:bg-gray-100 transition"
                                >
                                    Solana Huatulco →
                                </a>
                                <a
                                    href={properties[1].link}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="bg-white text-blue-600 px-8 py-4 rounded-lg font-bold hover:bg-gray-100 transition"
                                >
                                    Loft Amarindo →
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-400 py-8 text-center text-sm">
                        <p>Contacto: Roman Méndez • WhatsApp/Airbnb • Respuesta en 24 horas</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<HuatulcoLanding />);
    </script>
</body>
</html>
